<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Bestellen</h1>
    <div class="header-actions">
      <button type="button" class="history-btn" id="history-btn" title="Bekijk bezorgde bestellingen">🧾 Historie</button>
      <a href="index.html">← Terug</a>
    </div>
  </header>

  <div class="history-panel" id="history-panel">
    <div class="history-panel-head">
      <span>Bezorgde bestellingen</span>
      <button type="button" class="reset-btn" id="reset-history">Resetten</button>
    </div>
    <div id="history-list">
      <div class="empty-msg">Nog geen bezorgde bestellingen</div>
    </div>
    <div class="history-summary" id="history-summary"></div>
  </div>

  <div class="products" id="products"></div>

  <textarea class="note-field" id="opmerking" placeholder="Opmerking (optioneel), bijv. 'tafel 4'"></textarea>

  <button class="primary-btn" id="plaats-bestelling">Bestelling plaatsen</button>
  <div class="status-msg" id="status-msg"></div>

  <hr class="divider">

  <button class="toggle-btn" id="toggle-ready">Gemaakte bestellingen</button>
  <div class="ready-list" id="ready-list">
    <div class="empty-msg" id="empty-msg">Geen gemaakte bestellingen</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="products.js"></script>
<script src="bestellen.js"></script>

</body>
</html>
