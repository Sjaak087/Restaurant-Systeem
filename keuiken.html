<!DOCTYPE html>
<html>
<head>
  <title>Keukenscherm</title>
</head>
<body>
  <h1>Binnenkomende Bestellingen</h1>
  <ul id="lijst"></ul>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "JOUW_API_KEY",
      projectId: "JOUW_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Luister LIVE naar nieuwe bestellingen
    const q = query(collection(db, "bestellingen"), orderBy("tijd", "desc"));
    
    onSnapshot(q, (snapshot) => {
      const lijst = document.getElementById("lijst");
      lijst.innerHTML = ""; // Maak lijst leeg
      
      snapshot.forEach((doc) => {
        const item = doc.data();
        const li = document.createElement("li");
        li.textContent = item.product;
        lijst.appendChild(li);
      });
    });
  </script>
</body>
</html>
