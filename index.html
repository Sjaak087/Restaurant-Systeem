<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestel & Keuken Systeem</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .scherm {
      display: none;
      padding-top: 10%;
      min-height: 100vh;
    }
    .actief {
      display: block;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 25px;
    }
    
    /* Knoppen styling */
    .knop {
      background-color: #222;
      color: white;
      border: 2px solid white;
      padding: 20px 30px;
      font-size: 24px;
      margin: 12px auto;
      border-radius: 12px;
      cursor: pointer;
      width: 85%;
      max-width: 400px;
      display: block;
    }
    .knop:active {
      background-color: #444;
    }
    
    /* Keuken lijst styling */
    ul {
      list-style-type: none;
      padding: 0;
      max-width: 600px;
      margin: 20px auto;
    }
    li {
      background-color: #1c1c1c;
      border: 2px solid white;
      margin: 12px 15px;
      padding: 20px;
      font-size: 28px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vink-knop {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
    }
    .terug-knop {
      background-color: transparent;
      color: #888;
      border: 1px solid #555;
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 30px;
      border-radius: 8px;
      cursor: pointer;
    }
    #foutmelding {
      color: red;
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- 1. KEUZE SCHERM -->
  <div id="keuze-scherm" class="scherm actief">
    <h1>Kies jouw scherm</h1>
    <button class="knop" onclick="openScherm('bestel-scherm')">📱 Bestel Scherm (Kassa)</button>
    <button class="knop" onclick="openScherm('keuken-scherm')">👨‍🍳 Keukenscherm</button>
  </div>

  <!-- 2. BESTEL SCHERM -->
  <div id="bestel-scherm" class="scherm">
    <h1>Bestelling Doorgeven</h1>
    <button class="knop" onclick="bestel('🍔 Hamburger')">🍔 Hamburger</button>
    <button class="knop" onclick="bestel('🍟 Friet')">🍟 Friet</button>
    <button class="knop" onclick="bestel('🥤 Cola')">🥤 Cola</button>
    <button class="knop" onclick="bestel('🍦 Ijsje')">🍦 Ijsje</button>
    
    <br>
    <button class="terug-knop" onclick="openScherm('keuze-scherm')">← Terug naar menu</button>
  </div>

  <!-- 3. KEUKEN SCHERM -->
  <div id="keuken-scherm" class="scherm">
    <h1>👨‍🍳 Binnenkomende Bestellingen</h1>
    <ul id="bestellingen-lijst"></ul>
    
    <button class="terug-knop" onclick="openScherm('keuze-scherm')">← Terug naar menu</button>
  </div>

  <div id="foutmelding"></div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ Vul hier jouw Firebase gegevens in!
    const firebaseConfig = {
      apiKey: "AIzaSyBVwx6eUdSkebGIK2J_NDwOD3rxTcIg1v4",
      projectId: "restaurant-het-goedkoop"
    };

    let db;

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      
      // Start live luisteren voor het keukenscherm
      startKeukenLuisteraar();
    } catch (e) {
      document.getElementById('foutmelding').innerText = "Firebase kon niet laden. Controleer je API Keys!";
    }

    // Wisselen tussen schermen
    window.openScherm = function(schermId) {
      document.querySelectorAll('.scherm').forEach(s => s.classList.remove('actief'));
      document.getElementById(schermId).classList.add('actief');
    };

    // Bestelling versturen naar de cloud
    window.bestel = async function(item) {
      if (!db) return;
      try {
        await addDoc(collection(db, "bestellingen"), {
          product: item,
          tijd: serverTimestamp()
        });

        // Knipper-effect op geklikte knop ter bevestiging
        const knop = event.target;
        knop.style.backgroundColor = "green";
        setTimeout(() => knop.style.backgroundColor = "#222", 400);

      } catch (e) {
        document.getElementById('foutmelding').innerText = "Fout bij bestellen: " + e.message;
      }
    };

    // Live bestellingen binnenkrijgen op de keuken
    function startKeukenLuisteraar() {
      const q = query(collection(db, "bestellingen"), orderBy("tijd", "asc"));
      
      onSnapshot(q, (snapshot) => {
        const lijst = document.getElementById("bestellingen-lijst");
        lijst.innerHTML = ""; 

        if (snapshot.empty) {
          lijst.innerHTML = "<p style='color:#777;'>Geen actieve bestellingen...</p>";
          return;
        }
        
        snapshot.forEach((documentSnapshot) => {
          const item = documentSnapshot.data();
          const id = documentSnapshot.id;
          
          const li = document.createElement("li");
          li.textContent = item.product || "Onbekend item";
          
          // Vink-knop maken om bestelling te verwijderen wanneer klaar
          const vinkKnop = document.createElement("button");
          vinkKnop.textContent = "✔ Klaar";
          vinkKnop.className = "vink-knop";
          vinkKnop.onclick = async () => {
            await deleteDoc(doc(db, "bestellingen", id));
          };
          
          li.appendChild(vinkKnop);
          lijst.appendChild(li);
        });
      }, (error) => {
        document.getElementById('foutmelding').innerText = "Fout bij ophalen data. Staan de Firebase Rules op true?";
      });
    }
  </script>
</body>
</html>
