<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keukenscherm</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: sans-serif;
      padding: 5%;
      margin: 0;
    }
    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 40px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      max-width: 800px;
      margin: 0 auto;
    }
    li {
      background-color: #222;
      border: 2px solid white;
      margin: 15px 0;
      padding: 25px;
      font-size: 32px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .klaar-knop {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
    }
    #foutmelding { color: red; text-align: center; font-size: 24px; }
  </style>
</head>
<body>

  <h1>👨‍🍳 Actieve Bestellingen</h1>
  <div id="foutmelding"></div>
  <ul id="lijst"></ul>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ LET OP: Vul hier dezelfde Firebase gegevens in!
    const firebaseConfig = {
      apiKey: "VUL_HIER_JE_API_KEY_IN",
      projectId: "VUL_HIER_JE_PROJECT_ID_IN"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const bestellingenRef = collection(db, "bestellingen");
      const q = query(bestellingenRef, orderBy("tijd", "asc"));
      
      onSnapshot(q, (snapshot) => {
        const lijst = document.getElementById("lijst");
        lijst.innerHTML = ""; 
        
        snapshot.forEach((documentSnapshot) => {
          const item = documentSnapshot.data();
          const id = documentSnapshot.id; // Uniek ID van de bestelling
          
          const li = document.createElement("li");
          li.textContent = item.product || "Onbekend item";
          
          const klaarKnop = document.createElement("button");
          klaarKnop.textContent = "KLAAR ✔";
          klaarKnop.className = "klaar-knop";
          klaarKnop.onclick = async () => {
            await deleteDoc(doc(db, "bestellingen", id));
          };
          
          li.appendChild(klaarKnop);
          lijst.appendChild(li);
        });
      }, (error) => {
        document.getElementById('foutmelding').innerText = "Fout bij ophalen data. Staan je Firebase Rules goed?";
      });
    } catch (e) {
      document.getElementById('foutmelding').innerText = "Firebase laadfout. Check config!";
    }
  </script>
</body>
</html>
